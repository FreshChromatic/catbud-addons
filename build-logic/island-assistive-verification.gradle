sourceSets {
    verification {
        java.srcDirs = [file('../../shared/src/verification/java'), file('src/verification/java')]
        resources.srcDir file('../../shared/src/verification/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations.verificationImplementation.extendsFrom(configurations.implementation)
configurations.verificationRuntimeOnly.extendsFrom(configurations.runtimeOnly)
loom {
    mods {
        catbud_island_assistive { sourceSet sourceSets.main }
        catbud_island_assistive_verification { sourceSet sourceSets.verification }
    }
    runs {
        client {
            source sourceSets.verification
            runDir 'build/verification-island-assistive'
        }
    }
}
tasks.named('runClient') {
    dependsOn tasks.named('verificationClasses')
}
